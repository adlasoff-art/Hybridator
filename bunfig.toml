[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = [
  "@lovable.dev/vite-tanstack-config",
  "@lovable.dev/mcp-js",
  "@lovable.dev/email-js",
  "@lovable.dev/webhooks-js",
  # CVE-2026-102989 / GHSA-qx66-fv34-fjm8 — allow immediate security patches
  "@tanstack/react-start",
  "@tanstack/start-server-core",
  "@tanstack/solid-start",
  "@tanstack/vue-start",
]
